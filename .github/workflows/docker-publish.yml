name: 🚀 Build & Push Docker Image to Docker Hub

on:
  push:
    branches:
      - main   # or "master" — adjust to your default branch
  workflow_dispatch:  # allow manual trigger in GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repo
      - name: 🧾 Checkout code
        uses: actions/checkout@v4

      # Step 2: Login to Docker Hub
      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 3: Set up Docker Buildx (for multi-platform builds)
      - name: ⚙️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 4: Build and push image
      - name: 🏗️ Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/react-test-img:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/react-test-img:${{ github.sha }}

      # # Step 5: (optional) Scan for vulnerabilities with Snyk
